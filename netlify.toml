# Sitio estático sin build: se publica tal cual está el repositorio.
[build]
  publish = "."
  command = ""

# Los libros de embarque y los NOR se leen en el navegador; nada se sube.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
